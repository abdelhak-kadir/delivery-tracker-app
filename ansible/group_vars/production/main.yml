# Domain configuration
domains:
  frontend: "3assasa.software"
  api: "api.3assasa.software"

# Database configuration (from Terraform outputs)
database:
  host: "{{ production_db_host }}"
  port: 5432
  name: "delivery_tracker_production"
  username: "{{ vault_db_user }}"
  password: "{{ vault_db_password }}"
  pool_size: 20

# Application configuration
app_config:
  debug: no
  log_level: "INFO"
  cors_origins:
    - "https://3assasa.software"
    - "https://www.3assasa.software"
  jwt_secret: "{{ vault_production_jwt_secret }}"
  # Login of the app's single fixed user (APP_USER_USERNAME / APP_USER_PASSWORD)
  app_user_username: "{{ vault_app_user_username }}"
  app_user_password: "{{ vault_app_user_password }}"
  session_timeout: 3600

# Container images (GHCR; tag = <deploy_version>-<env_name>, override with backend_image_tag/frontend_image_tag)
containers:
  frontend:
    image: "{{ registry.url }}/{{ registry.namespace }}/react-frontend:{{ frontend_image_tag | default(deploy_version | mandatory ~ '-' ~ env_name) }}"
    port: 3000
    replicas: 2
  backend:
    image: "{{ registry.url }}/{{ registry.namespace }}/spring-boot-backend:{{ backend_image_tag | default(deploy_version | mandatory ~ '-' ~ env_name) }}"
    port: 8080
    replicas: 2
    health_check:
      path: "/actuator/health"
      interval: 15s
      timeout: 5s
      retries: 5

# Resource limits (production - optimized)
resource_limits:
  frontend:
    memory: "2g"
    cpus: "2.0"
  backend:
    memory: "4g"
    cpus: "4.0"

# SSL configuration
ssl_config:
  enabled: yes
  staging: no # Use Let's Encrypt production
  email: "admin@3assasa.software"
  hsts_enabled: yes
  redirect_http: yes

# Backup configuration
backup_config:
  enabled: yes
  schedule: "0 1 * * *" # Daily at 1 AM
  retention: 30        # days
  encryption: yes

# Monitoring
monitoring_config:
  enabled: yes
  alert_email: "alerts@3assasa.software"
  pager_duty_key: "{{ vault_pagerduty_key }}"
  slack_webhook: "{{ vault_production_slack_webhook }}"

# Performance tuning
performance:
  nginx:
    worker_processes: auto
    worker_connections: 1024
    keepalive_timeout: 65
    client_max_body_size: "10m"

# Security hardening
security_hardening:
  enable_csp: yes
  enable_hsts: yes
  hide_server_version: yes
  rate_limiting:
    enabled: yes
    requests_per_minute: 100