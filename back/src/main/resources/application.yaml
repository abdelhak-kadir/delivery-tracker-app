app:
  user:
    username: ${APP_USER_USERNAME}
    password: ${APP_USER_PASSWORD}
    roles: ROLE_ADMIN
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET}
    expiration:
      ms : 1800000

spring:
  application:
    name: app

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always